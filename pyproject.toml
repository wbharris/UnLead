[project]
name = "unlead"
version = "0.1.0"
description = "UnLead — local opt-out case for people-search and data-broker listings. Minimum fields, one site at a time."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "wbharris" }]
keywords = ["privacy", "opt-out", "data-broker", "people-search"]
dependencies = []

[project.urls]
Homepage = "https://github.com/wbharris/UnLead"
Repository = "https://github.com/wbharris/UnLead"

[project.scripts]
unlead = "unlead.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
